<head data-page-node-id="MnGUVWMOSYmGnGWl11FFxD">
  <meta charset="UTF-8" data-page-node-id="KQAI1AMYYFp5tqJLmi61br">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" data-page-node-id="V4akaZXVdaACwTTGwyWAcd">
  <title>空间镜 · 商家接单工作台</title>
  <style>
    :root{
      --bg:#f4f6fb; --card:#ffffff; --text:#0f172a; --muted:#64748b;
      --accent:#3b82f6; --teal:#22d3ee; --orange:#f59e0b; --green:#10b981;
      --purple:#8b5cf6; --border:#e6eaf2; --radius:16px; --shadow:0 6px 24px rgba(15,23,42,.06);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:24px}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh}

    .topbar{
      position:sticky;top:0;z-index:30;background:rgba(244,246,251,.92);
      backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
      padding:12px 16px;display:flex;align-items:center;gap:10px;
    }
    .topbar .back{font-size:1.4rem;color:var(--muted);width:28px}
    .topbar .shop{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:6px}
    .cert{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:999px;background:#ecfdf5;color:var(--green)}
    .topbar .sub{font-size:.7rem;color:var(--muted);margin-top:2px}
    .container{padding:14px 16px 16px}

    /* 概览 4 宫格 */
    .stats{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:20px;
      padding:16px;box-shadow:0 12px 30px rgba(15,23,42,.22);margin-bottom:14px}
    .stats .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .stats .sh b{font-size:.85rem;font-weight:800}
    .stats .sh span{font-size:.68rem;opacity:.75}
    .grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .scell{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
    .scell .k{font-size:.68rem;opacity:.85}
    .scell .v{font-size:1.15rem;font-weight:800;margin-top:2px}
    .withdraw{width:100%;margin-top:12px;border:none;border-radius:12px;padding:12px;
      background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#3b2606;font-weight:800;font-size:.85rem;cursor:pointer}
    .withdraw:active{transform:scale(.98)}

    /* Tab */
    .tabs{display:flex;background:#eef2f7;border-radius:12px;padding:3px;margin-bottom:14px}
    .tabs button{flex:1;border:none;background:transparent;font:inherit;font-size:.8rem;font-weight:700;
      padding:8px 0;border-radius:10px;cursor:pointer;color:var(--muted)}
    .tabs button.active{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(15,23,42,.08)}

    /* 订单卡 */
    .order{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
    .order .oh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .order .oc{font-size:.92rem;font-weight:800}
    .order .op{font-size:.76rem;color:var(--muted);margin-top:3px}
    .order .oa{font-size:1.05rem;font-weight:800;color:var(--orange);white-space:nowrap}
    .order .ost{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:8px}
    .st-new{background:#fee2e2;color:#dc2626}
    .st-doing{background:#dbeafe;color:#1d4ed8}
    .st-done{background:#dcfce7;color:#16a34a}
    .order .odesc{font-size:.76rem;color:#475569;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);line-height:1.5}
    .btn{border:none;border-radius:12px;padding:11px 10px;font-weight:700;font-size:.82rem;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
    .btn:active{transform:scale(.97)}
    .btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(59,130,246,.28)}
    .btn.ghost{background:#f1f5f9;color:#334155}
    .btn.warn{background:#fff7ed;color:#c2410c}
    .btn.done{background:#ecfdf5;color:var(--green)}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

    .empty{text-align:center;padding:40px 10px;color:var(--muted);font-size:.82rem}

    /* 弹层 */
    .mask{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);
      z-index:100;display:none;align-items:flex-end;justify-content:center}
    .mask.show{display:flex}
    .sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;
      max-height:86vh;overflow-y:auto;padding-bottom:20px}
    .sheet-head{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid var(--border);
      display:flex;justify-content:space-between;align-items:center}
    .sheet-head h3{font-size:1rem;font-weight:800}
    .sheet-close{font-size:1.4rem;color:var(--muted);cursor:pointer;line-height:1}
    .sheet-body{padding:14px 16px}
    .sec-t{font-size:.76rem;font-weight:800;color:var(--muted);margin:14px 0 7px}
    .sec-t:first-child{margin-top:0}
    .kv{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;padding:6px 0;border-bottom:1px dashed var(--border)}
    .kv .k{color:var(--muted)}
    .kv .v{font-weight:700;text-align:right}
    .planbox{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px}
    .planbox .pt{font-size:.86rem;font-weight:800;margin-bottom:6px}
    .amt{font-size:1.4rem;font-weight:800;color:var(--orange)}
    .row2b{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

    .toast{position:fixed;left:50%;bottom:60px;transform:translate(-50%,20px);
      background:rgba(15,23,42,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:.82rem;
      opacity:0;transition:.25s;z-index:200;pointer-events:none}
    .toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body data-page-node-id="fTdKaskJWNUQIiOv8nxszD">

  <!-- 订单详情弹层 -->
  <div class="mask" id="mask" data-page-node-id="VGxruCjSE1UfsNtVHzm9Aq">
    <div class="sheet" data-page-node-id="ExEHbpCMCuw8k9FFecZOM7">
      <div class="sheet-head" data-page-node-id="f6VtRFQGn71DeH3yD8E8oi">
        <h3 id="sheet-title" data-page-node-id="aCfWcvAhzAoyqq8G9XDUiV">订单详情</h3>
        <div class="sheet-close" id="sheet-close" data-page-node-id="9tynkTiz9aDEJM8u3pUsaI">×</div>
      </div>
      <div class="sheet-body" id="sheet-body" data-page-node-id="i910xYvOUucO4mHUICYzTb"></div>

  <div class="toast" id="toast" data-page-node-id="LtaLAaEpUhNCJOjWZRpGRe"></div>

  <script src="../assets/app-data.js"></script>
  <script>
    var SM = window.SPACE_MIRROR, D = SM.DIAGNOSIS, ROLE = 'merchant';
    var STATUS_CLASS = { lead: 'st-new', pending: 'st-new', design: 'st-doing', assigned: 'st-doing',
      onsite: 'st-doing', checking: 'st-doing', rescan: 'st-doing', done: 'st-done' };
    var TAB_OF = { wait: '待接单', doing: '进行中', done: '已完成' };
    var currentTab = '待接单';

    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._timer); t._timer = setTimeout(function () { t.classList.remove('show'); }, 2000);
    }
    function money(n) { return '¥' + Math.round(n).toLocaleString(); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

    // 概览全部由订单实时派生，不再写死
    function derived() {
      var all = SM.listOrders('all');
      var month = SM.todayStr().slice(0, 7);
      var thisMonth = all.filter(function (o) { return (o.created || '').slice(0, 7) === month; });
      var gmv = all.filter(function (o) { return o.stage !== 'lead'; })
        .reduce(function (s, o) { return s + o.amount; }, 0);
      var doneAmt = all.filter(function (o) { return o.stage === 'done'; })
        .reduce(function (s, o) { return s + o.amount; }, 0);
      return { orders: thisMonth.length, gmv: gmv, commission: gmv * 0.1, paid: doneAmt * 0.1, month: month, all: all };
    }

    function renderStats() {
      SM.loadOrders();
      var s = derived();
      document.getElementById('settle-month').textContent = s.month + ' 结算周期 · 实时统计';
      document.getElementById('s-orders').textContent = s.orders;
      document.getElementById('s-gmv').textContent = money(s.gmv);
      document.getElementById('s-comm').textContent = money(s.commission);
      document.getElementById('s-paid').textContent = money(s.paid);
      document.getElementById('btn-withdraw').textContent = '可提现 ' + money(s.paid) + ' → 提现';
      var sub = document.querySelector('.topbar .sub');
      sub.textContent = '本月成交 ' + money(s.gmv) + ' · 佣金 ' + money(s.commission) +
        ' · 在途 ' + s.all.filter(function (o) { return SM.stageTab(o.stage) === 'doing'; }).length + ' 单';
    }

    function permLine(o) {
      var acts = SM.actionsFor(o, ROLE);
      if (!acts.length) {
        return '<div class="odesc" style="background:#f1f5f9">本状态商家无可执行操作 · 由 ' +
          (SM.stageInfo(o.stage).actor === '工长' ? '工长' : SM.stageInfo(o.stage).actor) + ' 推进</div>';
      }
      return '<div class="odesc" style="background:#eff6ff">你（商家）此时可执行：' +
        acts.map(function (a) { return a.label; }).join(' · ') + '</div>';
    }

    function renderOrders() {
      SM.loadOrders();
      var all = SM.listOrders('all');
      var list = all.filter(function (o) { return TAB_OF[SM.stageTab(o.stage)] === currentTab; });
      var el = document.getElementById('order-list');
      if (!list.length) {
        el.innerHTML = '<div class="empty">该状态下暂无订单</div>';
        return;
      }
      el.innerHTML = list.map(function (o) {
        var p = SM.planById(o.planId);
        var acts = SM.actionsFor(o, ROLE);
        var actions = '<div class="row2">';
        acts.forEach(function (a, i) {
          var cls = a.key === 'accept' || a.key === 'design' ? 'primary' : (a.key === 'reject' ? 'ghost' : 'warn');
          actions += '<button class="btn ' + cls + '" data-act="' + a.key + '" data-id="' + o.id + '">' + a.label + '</button>';
        });
        if (!acts.length) actions += '<button class="btn ghost" data-act="detail" data-id="' + o.id + '">订单详情</button>';
        if (acts.length === 1) actions += '<button class="btn ghost" data-act="detail" data-id="' + o.id + '">订单详情</button>';
        actions += '</div>';
        return '<div class="order">' +
          '<div class="oh"><div><div class="oc">' + esc(o.homeName) + ' · ' + esc(o.customer.name) + ' ' + esc(o.customer.phone) + '</div>' +
            '<div class="op">' + esc(o.planName) + (p ? ' · ' + p.room + ' · ' + p.dimension : '') + ' · 单号 ' + esc(o.no) + '</div></div>' +
            '<div class="oa">' + money(o.amount) + '</div></div>' +
          '<span class="ost ' + (STATUS_CLASS[o.stage] || 'st-doing') + '">' + SM.stageLabel(o.stage) + '</span>' +
          (p ? '<div class="odesc">' + p.problem + ' → ' + p.action + '</div>' : '') +
          (o.stage === 'lead' ? '<div class="odesc" style="background:#f1f5f9">意向单 · 等待系统推送服务商</div>' : '') +
          permLine(o) +
          actions +
        '</div>';
      }).join('');

      el.querySelectorAll('[data-act]').forEach(function (b) {
        b.onclick = function () {
          var id = b.dataset.id, act = b.dataset.act;
          if (act === 'detail') { openDetail(id); return; }
          var r = SM.doAct(id, act, { role: ROLE });
          if (!r.ok) { toast('⛔ ' + r.reason); return; }
          var map = { accept: '已接单 · 进入方案设计', reject: '已婉拒该订单', design: '方案已上传并派工给工长', assign: '已改派施工队' };
          toast('✅ ' + (map[act] || '已更新'));
          renderStats(); renderOrders();
        };
      });
    }

    function openDetail(id) {
      var o = SM.getOrder(id);
      if (!o) return;
      var p = SM.planById(o.planId);
      document.getElementById('sheet-title').textContent = o.planName + ' · 订单详情';
      var tl = (o.timeline || []).map(function (t) {
        return '<div class="kv"><span class="k">' + t.time + '</span><span class="v">' +
          SM.stageLabel(t.stage) + ' · ' + esc(t.by) + (t.note ? ' · ' + esc(t.note) : '') + '</span></div>';
      }).join('');
      var c = o.crew;
      document.getElementById('sheet-body').innerHTML =
        '<div class="sec-t">客户与房子</div>' +
        '<div class="kv"><span class="k">客户</span><span class="v">' + esc(o.customer.name) + ' ' + esc(o.customer.phone) + '</span></div>' +
        '<div class="kv"><span class="k">小区</span><span class="v">' + esc(o.customer.community) + '</span></div>' +
        '<div class="kv"><span class="k">房子</span><span class="v">' + esc(o.homeName) + '</span></div>' +
        '<div class="kv"><span class="k">预算</span><span class="v">' + esc(o.customer.budget) + '</span></div>' +
        '<div class="kv"><span class="k">期望时间</span><span class="v">' + esc(o.requestedTime) + '</span></div>' +
        '<div class="kv"><span class="k">需求补充</span><span class="v">' + esc(o.need || '—') + '</span></div>' +
        '<div class="sec-t">方案内容（来自 C 端诊断方案）</div>' +
        '<div class="planbox">' +
          '<div class="pt">' + (p ? p.group : o.planName) + '</div>' +
          '<div class="kv"><span class="k">问题</span><span class="v">' + (p ? p.problem : '—') + '</span></div>' +
          '<div class="kv"><span class="k">动作</span><span class="v">' + (p ? p.action : '—') + '</span></div>' +
          '<div class="kv"><span class="k">效果</span><span class="v">' + (p ? p.effect : '—') + '</span></div>' +
        '</div>' +
        '<div class="sec-t">施工方（开放平台 M0）</div>' +
        '<div class="kv"><span class="k">工长</span><span class="v">' + (c ? esc(c.name) + ' · ' + esc(c.team) + ' ' + esc(c.phone) : '尚未派工') + '</span></div>' +
        '<div class="kv"><span class="k">材料验收</span><span class="v">' + (function () { var s = SM.checkStats(o); return s.done + '/' + s.total; })() + '</span></div>' +
        '<div class="sec-t">状态流转</div>' + tl +
        '<div class="sec-t">金额</div>' +
        '<div class="amt">' + money(o.amount) + '</div>' +
        '<div class="row2b">' +
          '<button class="btn ghost" id="btn-contact">联系客户</button>' +
          '<button class="btn primary" id="btn-photo">上传进度照片</button>' +
        '</div>' +
        '<div style="margin-top:10px;text-align:center;font-size:.68rem;color:var(--muted)">' +
          '<a href="../site/index.html" style="color:var(--accent)">去工长施工端看现场进度 →</a></div>';
      document.getElementById('mask').classList.add('show');
      document.getElementById('btn-contact').onclick = function () { toast('演示中 · 真实环境将呼叫客户'); };
      document.getElementById('btn-photo').onclick = function () { toast('进度照片已上传并同步给业主与工长（演示）'); };
    }

    document.getElementById('tabs').querySelectorAll('button').forEach(function (b) {
      b.onclick = function () {
        document.getElementById('tabs').querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        currentTab = b.dataset.tab; renderOrders();
      };
    });
    document.getElementById('btn-withdraw').onclick = function () { toast('提现申请已提交 · 预计 1–3 个工作日到账（演示）'); };
    document.getElementById('sheet-close').onclick = function () { document.getElementById('mask').classList.remove('show'); };
    document.getElementById('mask').onclick = function (e) { if (e.target === this) this.classList.remove('show'); };

    SM.loadOrders(); SM.loadHomes();
    renderStats(); renderOrders();
  </script>
