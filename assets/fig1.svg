<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" xml:lang="zh-CN">
  <defs>
    <style>
      .t { font-family: 'Source Han Sans SC','Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #64748b; }
      .box-label { font-size: 12px; fill: #64748b; font-weight: 600; }
      .box-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .box-title-w { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .box-desc { font-size: 12px; fill: #475569; }
      .box-desc-w { font-size: 12px; fill: #cbd5e1; }
      .rev-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .rev-desc { font-size: 11px; fill: #64748b; }
      .note { font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="860" height="520" fill="#ffffff" rx="12"/>
  <text x="32" y="38" class="t title">空间镜：把家变成可计算、可优化、可变现的数字孪生空间</text>
  <text x="32" y="62" class="t sub">商业模式总览 · 产品能力 → 用户价值 → 收入来源</text>

  <!-- 入口 -->
  <rect x="32" y="88" width="236" height="140" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10"/>
  <text x="52" y="116" class="t box-label">入口 · 零门槛采集</text>
  <text x="52" y="144" class="t box-title">手机扫描房间</text>
  <text x="52" y="170" class="t box-desc">LiDAR / 单目摄像头 3 分钟生成</text>
  <text x="52" y="190" class="t box-desc">可编辑的数字孪生空间</text>

  <!-- 箭头 -->
  <line x1="270" y1="158" x2="296" y2="158" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="296,150 312,158 296,166" fill="#94a3b8"/>

  <!-- 核心资产 -->
  <rect x="312" y="88" width="236" height="140" fill="#0f172a" stroke="#0f172a" stroke-width="1" rx="10"/>
  <text x="332" y="116" class="t box-label" style="fill:#94a3b8">核心资产 · 数字孪生家</text>
  <text x="332" y="144" class="t box-title-w">云端孪生 · 多端访问</text>
  <text x="332" y="170" class="t box-desc-w">手机采集、电脑编辑分析、跨设备</text>
  <text x="332" y="190" class="t box-desc-w">实时同步的空间数据底座</text>

  <!-- 箭头 -->
  <line x1="550" y1="158" x2="576" y2="158" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="576,150 592,158 576,166" fill="#94a3b8"/>

  <!-- 价值 -->
  <rect x="592" y="88" width="236" height="140" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10"/>
  <text x="612" y="116" class="t box-label">价值 · 持续优化物理环境</text>
  <text x="612" y="144" class="t box-title">AI 分析与 AR 叠加</text>
  <text x="612" y="170" class="t box-desc">动线 / 采光 / 收纳 / 噪音诊断，</text>
  <text x="612" y="190" class="t box-desc">改造方案，AR 信息与智能家居联动</text>

  <!-- 收入来源 -->
  <rect x="32" y="260" width="190" height="100" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="10"/>
  <rect x="32" y="260" width="190" height="4" fill="#2563eb" rx="2"/>
  <text x="48" y="292" class="t rev-title">订阅收入</text>
  <text x="48" y="318" class="t rev-desc">高级方案、家庭版订阅，AI 诊断</text>
  <text x="48" y="336" class="t rev-desc">与方案按月 / 年付费</text>

  <rect x="242" y="260" width="190" height="100" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="10"/>
  <rect x="242" y="260" width="190" height="4" fill="#d97706" rx="2"/>
  <text x="258" y="292" class="t rev-title">商家佣金</text>
  <text x="258" y="318" class="t rev-desc">方案内推荐家居商品与改造商家，</text>
  <text x="258" y="336" class="t rev-desc">按成交抽佣（CPS）</text>

  <rect x="452" y="260" width="190" height="100" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="10"/>
  <rect x="452" y="260" width="190" height="4" fill="#0d9488" rx="2"/>
  <text x="468" y="292" class="t rev-title">智能家居分成</text>
  <text x="468" y="318" class="t rev-desc">联动设备激活引流、场景订阅与</text>
  <text x="468" y="336" class="t rev-desc">平台合作分成</text>

  <rect x="662" y="260" width="166" height="100" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="10"/>
  <rect x="662" y="260" width="166" height="4" fill="#7c3aed" rx="2"/>
  <text x="678" y="292" class="t rev-title">B 端 SaaS</text>
  <text x="678" y="318" class="t rev-desc">装修公司、设计师、物业与地产</text>
  <text x="678" y="336" class="t rev-desc">按席位 / 项目付费</text>

  <text x="32" y="420" class="t note">注：收入结构见完整商业方案；数据为产品规划假设，非实际经营数据。</text>
</svg>