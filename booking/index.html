<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>空间镜 · 预约改造顾问</title>
  <link rel="stylesheet" href="../assets/app.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="../cart/index.html">‹</a>
      <div>
        <h1>预约改造顾问</h1>
        <div class="sub">提交需求 · 顾问 1 对 1</div>
      </div>
    </div>

    <div class="container">
      <div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff;border:none">
        <div style="font-weight:800;font-size:1rem">把方案交给专业顾问</div>
        <div style="font-size:.8rem;opacity:.92;margin-top:4px">留下联系方式，顾问会结合你的诊断方案与购物清单，给出落地预算与排期。</div>
      </div>

      <!-- 清单摘要 -->
      <div class="card" id="cart-sum" style="margin-bottom:14px;display:none">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:800">本次购物清单</div>
          <div style="font-weight:800;color:var(--accent)" id="cart-amt">¥0</div>
        </div>
        <div class="r-sub" id="cart-sub" style="margin-top:4px">—</div>
      </div>

      <div class="card">
        <div style="font-weight:800;margin-bottom:12px">联系方式</div>
        <div class="field-input" id="f-name" placeholder="姓名" style="margin-bottom:10px"></div>
        <div class="field-input" id="f-phone" type="tel" inputmode="numeric" maxlength="11" placeholder="手机号" style="margin-bottom:10px"></div>
        <div class="field-input" id="f-estate" placeholder="小区 / 楼盘" style="margin-bottom:10px"></div>
        <select class="field-input" id="f-budget" style="margin-bottom:10px">
          <option value="">预算区间</option>
          <option>1 万以内</option>
          <option>1–3 万</option>
          <option>3–8 万</option>
          <option>8 万以上</option>
        </select>
        <textarea class="field-input" id="f-note" rows="3" placeholder="补充需求（选填）：如想重点解决收纳 / 采光…"></textarea>
        <button class="btn primary block" id="submit-btn" style="margin-top:14px">提交预约</button>
        <div class="r-sub" style="text-align:center;margin-top:8px">演示：提交后本地保存，不会真实发送</div>
      </div>

      <div id="done" class="card" style="display:none;margin-top:14px;border:1px solid var(--green);background:#ecfdf5">
        <div style="font-weight:800;color:var(--green)">✅ 预约已提交</div>
        <div class="r-sub" id="done-sub" style="margin-top:6px"></div>
      </div>
    </div>

    <div class="tabbar">
      <a class="tab" href="../prototype/index.html"><span class="ti">🏠</span><span>原型</span></a>
      <a class="tab" href="../plan/index.html"><span class="ti">📋</span><span>方案</span></a>
      <a class="tab" href="../cart/index.html"><span class="ti">🛒</span><span>清单</span><span class="tab-badge" data-cart-badge>0</span></a>
      <a class="tab active" href="../account/index.html"><span class="ti">👤</span><span>我的</span></a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../assets/app-data.js"></script>
  <script>
    var SM = window.SPACE_MIRROR;
    var $ = function (id) { return document.getElementById(id); };
    function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1600);}

    // 清单摘要
    var total = SM.cartTotal();
    if (total > 0) {
      $('cart-sum').style.display = '';
      $('cart-amt').textContent = '¥' + total.toLocaleString();
      var disc = SM.cartDiscount(total);
      $('cart-sub').textContent = '合计 ¥' + total.toLocaleString() + (disc ? ' · 套餐优惠后 ¥' + (total - disc).toLocaleString() : '') + ' · 顾问将一并比价';
    }

    $('submit-btn').addEventListener('click', function () {
      var name = $('f-name').value.trim();
      var phone = $('f-phone').value.trim();
      var estate = $('f-estate').value.trim();
      var budget = $('f-budget').value;
      if (!name) { toast('请填写姓名'); return; }
      if (!/^\d{11}$/.test(phone)) { toast('请填写 11 位手机号'); return; }
      if (!estate) { toast('请填写小区 / 楼盘'); return; }
      if (!budget) { toast('请选择预算区间'); return; }
      var rec = { name: name, phone: phone, estate: estate, budget: budget, note: $('f-note').value.trim(), cartTotal: total, at: new Date().toISOString() };
      try { localStorage.setItem('spacemirror_booking_v1', JSON.stringify(rec)); } catch (e) {}
      $('done-sub').textContent = name + ' · ' + phone + ' · ' + estate + ' · ' + budget + (total > 0 ? ' · 含清单 ¥' + total.toLocaleString() : '');
      $('done').style.display = '';
      this.disabled = true; this.textContent = '已提交';
      toast('预约提交成功，顾问会尽快联系你');
    });

    SM.renderBadges();
  </script>
</body>
</html>
