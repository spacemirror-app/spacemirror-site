<head data-page-node-id="mAssU0p7EOrHczUy0wFXUE">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="pucj1zyL8MQcmxGVWB9DBY">
  <title>空间镜 PC 控制台</title>
  <style>
    :root{
      --bg:#f4f6fb; --card:#ffffff; --text:#0f172a; --muted:#64748b;
      --accent:#3b82f6; --teal:#22d3ee; --orange:#f59e0b; --green:#10b981;
      --purple:#8b5cf6; --border:#e6eaf2; --radius:16px; --shadow:0 6px 24px rgba(15,23,42,.06);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--text);line-height:1.5}
    a{color:inherit;text-decoration:none}

    /* ── 顶部栏 ── */
    .topbar{
      position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:18px;padding:12px 22px;
      box-shadow:0 2px 10px rgba(15,23,42,.04);
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:250px}
    .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--teal));
      display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1rem}
    .brand h1{font-size:1rem;font-weight:800;line-height:1.2}
    .brand .sub{font-size:.7rem;color:var(--muted)}

    .home-switch{flex:1;display:flex;align-items:center;gap:8px;justify-content:center}
    .home-switch select{
      font:inherit;font-size:.84rem;font-weight:600;padding:8px 12px;border-radius:10px;
      border:1px solid var(--border);background:#f8fafc;color:var(--text);min-width:230px;cursor:pointer;
    }
    .home-switch .lbl{font-size:.72rem;color:var(--muted)}

    .tb-right{display:flex;align-items:center;gap:12px;min-width:250px;justify-content:flex-end}
    .sync{font-size:.72rem;color:var(--muted);text-align:right;line-height:1.35}
    .sync b{color:var(--green);font-weight:700}
    .avatar{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#4f46e5;
      display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem}
    .vip{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px;background:#fef3c7;color:#d97706}
    .vip.pro{background:#ede9fe;color:#7c3aed}

    /* ── 主体两栏 ── */
    .shell{display:grid;grid-template-columns:280px 1fr;gap:18px;max-width:1440px;margin:0 auto;padding:18px 22px 40px}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

    /* 左侧栏 */
    .side{padding:14px;align-self:start;position:sticky;top:78px}
    .side h3{font-size:.82rem;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .side h3 span{font-size:.7rem;color:var(--muted);font-weight:600}
    .asset{border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer;transition:.15s}
    .asset:hover{border-color:#c7d2fe}
    .asset.active{border-color:var(--accent);background:#f0f7ff;box-shadow:0 4px 14px rgba(59,130,246,.12)}
    .asset .an{font-size:.82rem;font-weight:700;display:flex;justify-content:space-between;gap:6px;align-items:center}
    .asset .am{font-size:.68rem;color:var(--muted);margin-top:3px}
    .asset .ops{display:flex;gap:6px;margin-top:8px}
    .mini{font-size:.68rem;padding:4px 8px;border-radius:8px;background:#f1f5f9;color:#334155;border:none;cursor:pointer;font-weight:600}
    .mini:hover{background:#e2e8f0}
    .mini.on{background:#ecfdf5;color:var(--green)}
    .badge-live{font-size:.62rem;padding:1px 6px;border-radius:999px;background:#ecfdf5;color:var(--green);font-weight:700}
    .add-home{width:100%;border:1px dashed #cbd5e1;background:#fff;border-radius:12px;padding:10px;
      font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
    .add-home:hover{border-color:var(--accent);color:var(--accent)}

    /* 主区域 */
    .main{display:flex;flex-direction:column;gap:16px;min-width:0}
    .block{padding:16px}
    .block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
    .block-head h2{font-size:.95rem;font-weight:800}
    .block-head .desc{font-size:.7rem;color:var(--muted);margin-top:2px}
    .btn{border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:.8rem;cursor:pointer;transition:.15s}
    .btn:active{transform:scale(.97)}
    .btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(59,130,246,.28)}
    .btn.ghost{background:#f1f5f9;color:#334155}
    .btn.sm{padding:6px 11px;font-size:.72rem}

    /* 1. 孪生户型图 */
    .fp-tools{display:flex;gap:8px;align-items:center}
    .seg{display:flex;background:#f1f5f9;border-radius:10px;padding:3px}
    .seg button{border:none;background:transparent;font:inherit;font-size:.74rem;font-weight:700;
      padding:5px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
    .seg button.active{background:#fff;color:var(--accent);box-shadow:0 2px 6px rgba(15,23,42,.08)}
    .fp-stage{
      position:relative;height:400px;border-radius:14px;overflow:hidden;
      background:linear-gradient(135deg,#eef2f9,#e2e8f2);transition:transform .5s ease;
    }
    .fp-stage.mode3d{transform:perspective(1000px) rotateX(56deg) rotateZ(-14deg) scale(.86)}
    .fp-plane{position:absolute;inset:0}
    .rm{position:absolute;border:2px solid #94a3b8;background:rgba(255,255,255,.55);border-radius:6px}
    .rm .rl{position:absolute;top:4px;left:8px;font-size:.66rem;font-weight:700;color:#475569}
    .fp-item{
      position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-size:.7rem;font-weight:700;color:#fff;cursor:grab;user-select:none;
      box-shadow:0 6px 14px rgba(15,23,42,.18);touch-action:none;
    }
    .fp-item:active{cursor:grabbing}
    .fp-item.sofa{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
    .fp-item.table{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
    .fp-item.bed{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}
    .fp-item.cab{background:linear-gradient(135deg,#34d399,#10b981)}
    .fp-hint{position:absolute;left:12px;bottom:10px;font-size:.66rem;color:#64748b;background:rgba(255,255,255,.8);
      padding:4px 9px;border-radius:999px}

    /* 2. 四维诊断 */
    .diag-grid{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
    .score-big{text-align:center;padding:14px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#22d3ee);color:#fff}
    .score-big b{font-size:2.8rem;font-weight:800;line-height:1;display:block}
    .score-big span{font-size:.72rem;opacity:.92}
    .bars{display:flex;flex-direction:column;gap:10px}
    .bar-row{display:grid;grid-template-columns:74px 1fr 46px;align-items:center;gap:10px}
    .bar-row .bl{font-size:.76rem;font-weight:700}
    .bar-track{height:10px;background:#eef2f7;border-radius:999px;overflow:hidden}
    .bar-fill{height:100%;border-radius:999px;transition:width .6s ease}
    .bar-row .bv{font-size:.78rem;font-weight:800;text-align:right}

    /* 3. 前后对比 */
    .cmp-rows{display:flex;flex-direction:column;gap:12px}
    .cmp-row{display:grid;grid-template-columns:74px 1fr 1fr 52px;align-items:center;gap:10px}
    .cmp-row .cl{font-size:.76rem;font-weight:700}
    .cmp-bar{height:14px;background:#eef2f7;border-radius:999px;overflow:hidden;position:relative}
    .cmp-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;display:block}
    .cmp-bar.before i{background:#cbd5e1}
    .cmp-bar.after i{opacity:.95}
    .delta{font-size:.72rem;font-weight:800;color:var(--green);text-align:right}
    .cmp-foot{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);flex-wrap:wrap}
    .composite{font-size:1.3rem;font-weight:800}
    .composite em{font-style:normal;color:var(--muted);font-size:.8rem;font-weight:600}
    .up-badge{font-size:.74rem;font-weight:800;color:var(--green);background:#ecfdf5;padding:3px 9px;border-radius:999px}

    /* 4. 方案列表 */
    .plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
    .pcard{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff;transition:.15s}
    .pcard:hover{border-color:var(--accent);box-shadow:0 8px 20px rgba(59,130,246,.12)}
    .pcard .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .pcard .pt{font-size:.84rem;font-weight:800}
    .pcard .pm{font-size:.68rem;color:var(--muted);margin-top:3px}
    .pcard .pd{font-size:.74rem;color:#475569;margin-top:8px;line-height:1.45}
    .pcard .pf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)}
    .pcard .pb{font-size:.78rem;font-weight:800}
    .prio{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
    .prio.high{background:#fee2e2;color:#dc2626}
    .prio.medium{background:#fef3c7;color:#d97706}
    .prio.low{background:#dcfce7;color:#16a34a}

    /* Toast */
    .toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);
      background:rgba(15,23,42,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:.82rem;
      opacity:0;transition:.25s;z-index:200;pointer-events:none}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media (max-width:1100px){
      .shell{grid-template-columns:1fr}
      .side{position:static}
      .diag-grid{grid-template-columns:1fr}
      .topbar{flex-wrap:wrap;gap:10px}
      .home-switch{order:3;justify-content:flex-start;width:100%}
    }
  </style>
</head>

  <script>
    var SM = window.SPACE_MIRROR;
    var acc = SM.loadAccount();
    var homes = SM.loadHomes();
    var D = SM.DIAGNOSIS, R = SM.RESCAN, PL = SM.PRIORITY_LABEL;

    // 当前家资产（支持 ?home=h1）
    var params = new URLSearchParams(location.search);
    var currentId = params.get('home') || homes[0].id;

    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._timer); t._timer = setTimeout(function () { t.classList.remove('show'); }, 2000);
    }

    /* ---------- 顶部栏 ---------- */
    function renderTopbar() {
      var sel = document.getElementById('home-select');
      sel.innerHTML = homes.map(function (h) {
        return '<option value="' + h.id + '"' + (h.id === currentId ? ' selected' : '') + '>' + h.name + '</option>';
      }).join('');
      sel.onchange = function () { location.search = '?home=' + sel.value; };

      var phone = acc.devices.filter(function (d) { return d.type === 'phone'; })[0] || acc.devices[0];
      document.getElementById('sync-info').innerHTML =
        '<b>● 已同步</b><br>' + (phone ? phone.name + ' · 2 小时前同步' : '暂无采集设备');
      document.getElementById('acc-name').textContent = acc.name || '空间镜用户';
      var vip = document.getElementById('vip-tag');
      vip.textContent = acc.plan || '免费版';
      if (acc.plan && acc.plan !== '免费版') vip.className = 'vip pro';
      document.getElementById('avatar').textContent = (acc.name || '用').slice(0, 1);
    }

    /* ---------- 左侧栏 ---------- */
    function renderSide() {
      document.getElementById('asset-count').textContent = homes.length + ' 个';
      document.getElementById('asset-list').innerHTML = homes.map(function (h) {
        return '<div class="asset' + (h.id === currentId ? ' active' : '') + '" data-id="' + h.id + '">' +
          '<div class="an">' + h.name +
            (h.shared ? '<span class="badge-live">已分享</span>' : '') + '</div>' +
          '<div class="am">' + h.area + ' · 更新 ' + h.updated + ' · 扫描 ' + h.scans + ' 次</div>' +
          '<div class="ops">' +
            '<button class="mini" data-act="rename">重命名</button>' +
            '<button class="mini' + (h.shared ? ' on' : '') + '" data-act="share">' + (h.shared ? '已分享' : '分享') + '</button>' +
            '<button class="mini" data-act="glb">导出 GLB</button>' +
          '</div></div>';
      }).join('');

      document.getElementById('asset-list').querySelectorAll('.asset').forEach(function (el) {
        el.addEventListener('click', function (e) {
          var btn = e.target.closest('[data-act]');
          var id = el.dataset.id;
          if (btn) {
            e.stopPropagation();
            var act = btn.dataset.act;
            if (act === 'rename') {
              var h = SM.getHome(id);
              var v = prompt('重命名家资产', h.name);
              if (v && v.trim()) { SM.renameHome(id, v.trim()); toast('已重命名为「' + v.trim() + '」'); renderAll(); }
            } else if (act === 'share') {
              SM.toggleShare(id);
              toast(SM.getHome(id).shared ? '已开启分享 · 链接已复制' : '已关闭分享');
              renderAll();
            } else {
              toast('正在导出 ' + SM.getHome(id).glb + ' …（演示）');
            }
          } else {
            currentId = id; renderAll();
          }
        });
      });
    }

    /* ---------- 1 户型图 ---------- */
    function initFloorplan() {
      var stage = document.getElementById('fp-stage');
      document.getElementById('view-seg').querySelectorAll('button').forEach(function (b) {
        b.onclick = function () {
          document.getElementById('view-seg').querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          stage.classList.toggle('mode3d', b.dataset.view === '3d');
          toast(b.dataset.view === '3d' ? '已切换到 3D 孪生视图' : '已切换到 2D 平面视图');
        };
      });
      document.getElementById('btn-rescan').onclick = function () {
        toast('正在唤起手机端复扫…（演示）');
        setTimeout(function () { location.href = '../compare/index.html'; }, 700);
      };

      // 拖拽家具
      stage.querySelectorAll('.fp-item').forEach(function (it) {
        var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
        it.addEventListener('pointerdown', function (e) {
          dragging = true; it.setPointerCapture(e.pointerId);
          var r = stage.getBoundingClientRect(), ir = it.getBoundingClientRect();
          sx = e.clientX; sy = e.clientY;
          ox = ir.left - r.left; oy = ir.top - r.top;
          e.preventDefault();
        });
        it.addEventListener('pointermove', function (e) {
          if (!dragging) return;
          var r = stage.getBoundingClientRect();
          var nx = Math.max(0, Math.min(r.width - it.offsetWidth, ox + (e.clientX - sx)));
          var ny = Math.max(0, Math.min(r.height - it.offsetHeight, oy + (e.clientY - sy)));
          it.style.left = (nx / r.width * 100) + '%';
          it.style.top = (ny / r.height * 100) + '%';
        });
        it.addEventListener('pointerup', function () {
          if (dragging) { dragging = false; toast('已移动「' + it.dataset.f + '」· 同步到手机端'); }
        });
      });
    }

    /* ---------- 2 四维诊断 ---------- */
    function renderDiag() {
      document.getElementById('diag-total').textContent = D.totalScore;
      var h = SM.getHome(currentId) || homes[0];
      document.getElementById('diag-desc').textContent = h.name + ' · ' + D.home + ' · 诊断日期 ' + D.date;
      document.getElementById('diag-bars').innerHTML = D.radar.map(function (r) {
        return '<div class="bar-row">' +
          '<div class="bl">' + r.label + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + r.score + '%;background:' + r.color + '"></div></div>' +
          '<div class="bv" style="color:' + r.color + '">' + r.score + '</div>' +
        '</div>';
      }).join('');
    }

    /* ---------- 3 前后对比 ---------- */
    function renderCompare() {
      document.getElementById('cmp-rows').innerHTML = R.before.map(function (b, i) {
        var a = R.after[i], d = a.score - b.score;
        return '<div class="cmp-row">' +
          '<div class="cl">' + b.label + '</div>' +
          '<div class="cmp-bar before"><i style="width:' + b.score + '%"></i></div>' +
          '<div class="cmp-bar after"><i style="width:' + a.score + '%;background:' + a.color + '"></i></div>' +
          '<div class="delta">+' + d + '</div>' +
        '</div>';
      }).join('');
      // 改造前用诊断综合分（72），改造后用复扫四维均值（84）
      var cb = D.totalScore, ca = SM.rescanComposite(R.after);
      document.getElementById('composite').innerHTML = cb + ' <em>→</em> ' + ca;
      document.getElementById('composite-up').textContent = '复合分 +' + (ca - cb);
      document.getElementById('cmp-desc').textContent =
        '左：改造前 ' + R.dateBefore + '　右：改造后 ' + R.dateAfter;
    }

    /* ---------- 4 方案列表 ---------- */
    function renderPlans() {
      document.getElementById('plan-grid').innerHTML = D.plans.map(function (p) {
        return '<div class="pcard">' +
          '<div class="ph"><div><div class="pt">' + p.group + '</div>' +
            '<div class="pm">' + p.room + ' · ' + p.dimension + ' · ' + p.duration + '</div></div>' +
            '<span class="prio ' + p.priority + '">' + PL[p.priority] + '优先</span></div>' +
          '<div class="pd">' + p.action + '</div>' +
          '<div class="pf"><div class="pb">¥' + p.budgetMin.toLocaleString() + '–' + p.budgetMax.toLocaleString() + '</div>' +
            '<a class="btn ghost sm" href="../plan/index.html">跳转方案详情 →</a></div>' +
        '</div>';
      }).join('');
    }

    document.getElementById('btn-add-home').onclick = function () {
      toast('请在手机端扫描新房间后自动同步（演示）');
    };

    function renderAll() { renderTopbar(); renderSide(); renderDiag(); renderCompare(); renderPlans(); }
    renderAll(); initFloorplan();
  </script>
</body>
</html>
